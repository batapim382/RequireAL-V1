<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RequiresAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        :root {
            /* Roblox Dark Theme Colors */
            --bg-color: #111216;
            --panel-bg: #232527;
            --border-color: #393b3d;
            --hover-bg: #2b2e30;
            --primary-blue: #0060ff; 
            --primary-blue-hover: #1a71ff;
            --text-light: #ffffff;
            --text-muted: #bdbebe;
            --star-color: #ffca28;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * { transition: background-color 0.2s, border-color 0.2s; box-sizing: border-box; }

        body { 
            font-family: var(--font-family); 
            background-color: var(--bg-color); 
            color: var(--text-light);
            margin: 0; padding: 20px; 
            display: flex; justify-content: center; min-height: 100vh;
        }

        .container { width: 100%; max-width: 1200px; z-index: 1; }
        h1 { font-size: 2.2rem; margin: 0 0 5px 0; font-weight: 800; letter-spacing: -0.5px; }
        p.subtitle { color: var(--text-muted); margin: 0 0 30px 0; font-size: 1rem; }

        .main-layout { display: flex; gap: 30px; }
        
        /* Sidebar */
        .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }
        .sidebar-panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--border-color); 
            padding: 20px; border-radius: 8px; 
        }
        .sidebar-panel h3 { margin-top: 0; margin-bottom: 12px; font-size: 0.9rem; color: var(--text-light); font-weight: 700; }

        /* UI Inputs */
        .input-ui { 
            width: 100%; padding: 12px 16px; background: var(--bg-color); 
            border: 1px solid var(--border-color); border-radius: 8px; 
            color: var(--text-light); font-family: inherit; margin-bottom: 10px; font-size: 0.95rem;
        }
        .input-ui:focus { border-color: var(--text-light); outline: none; }

        /* Navigation Buttons */
        .filter-btn { 
            background: transparent; border: 1px solid transparent; color: var(--text-muted); 
            text-align: left; padding: 10px 12px; border-radius: 8px; cursor: pointer; width: 100%; 
            font-family: inherit; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 8px;
        }
        .filter-btn:hover { background: var(--hover-bg); color: var(--text-light); }
        .filter-btn.active { color: var(--text-light); background: var(--hover-bg); }

        .btn-main { 
            background: var(--primary-blue); color: white; border: none; padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-weight: 700; font-family: inherit; font-size: 0.95rem;
        }
        .btn-main:hover { background: var(--primary-blue-hover); }
        .btn-secondary { background: var(--hover-bg); border: 1px solid var(--border-color); color: white; }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:hover { background: #c0392b; }

        /* Form Creator Elements */
        .creation-tag-wrapper { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .creation-tag-box { display: none; }
        .creation-tag-label { background: var(--bg-color); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; font-weight: 600; }
        .creation-tag-box:checked + .creation-tag-label { border-color: var(--primary-blue); color: var(--primary-blue); background: rgba(0, 96, 255, 0.1); }

        .file-row { display: flex; gap: 15px; margin-bottom: 15px; background: var(--bg-color); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); }
        .file-field { display: flex; flex-direction: column; gap: 5px; flex: 1; font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
        .file-field input { color: white; font-size: 0.85rem; }

        /* Feed Layouts */
        .content-area { flex-grow: 1; display: flex; flex-direction: column; gap: 25px; }
        #feed.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        #feed.list-view { display: flex; flex-direction: column; gap: 15px; }

        /* Post Cards */
        .require-post { 
            background: transparent; border: none; 
            border-radius: 8px; display: flex; flex-direction: column; 
            cursor: pointer; position: relative;
        }
        .require-post:hover .post-banner-img { opacity: 0.8; }
        .require-post:hover .no-image-fallback { background: var(--hover-bg); }
        
        .post-content-wrapper { display: flex; flex-direction: column; flex-grow: 1; width: 100%; overflow: hidden; }
        .post-header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .post-actions { display: flex; align-items: center; gap: 12px; }
        
        .post-title-text { font-size: 1.05rem; color: var(--text-light); margin: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .post-author-text { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }
        
        .star-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0; }
        .star-btn.active { color: var(--star-color); }
        .menu-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 0; font-weight: bold; }
        .menu-btn:hover { color: var(--text-light); }

        .post-banner-img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: var(--panel-bg); border: 1px solid var(--border-color); }
        
        .no-image-fallback {
            width: 100%; aspect-ratio: 1/1; border-radius: 8px; margin-bottom: 10px;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-muted); font-size: 0.9rem; font-weight: 600; flex-shrink: 0;
        }

        /* List View Overrides */
        .list-view .require-post { flex-direction: row; align-items: center; background: var(--panel-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); }
        .list-view .post-banner-img, .list-view .no-image-fallback { width: 80px; height: 80px; margin-bottom: 0; margin-right: 15px; }
        .list-view .post-header-top { margin-bottom: 4px; }
        .list-view .post-author-text { margin-bottom: 8px; }

        .require-text { 
            flex-grow: 1; background: var(--bg-color); padding: 12px; border-radius: 8px; 
            border: 1px solid var(--border-color); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted); overflow: hidden; text-overflow: ellipsis;
        }
        .list-view .require-text { white-space: nowrap; height: 42px; }

        /* Modals */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.85); z-index: 100; 
            display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: 0.2s; 
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .modal { 
            background: var(--panel-bg); border: 1px solid var(--border-color); 
            padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative;
        }

        /* Avatar System */
        .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 15px 0; }
        .avatar-opt { 
            font-size: 1.5rem; cursor: pointer; padding: 12px; 
            background: var(--bg-color); border: 2px solid var(--border-color); 
            border-radius: 8px; text-align: center;
        }
        .avatar-opt:hover { background: var(--hover-bg); }
        .avatar-opt.selected { border-color: var(--primary-blue); background: rgba(0, 96, 255, 0.1); }

        /* Comments Engine UI */
        .comments-section { border-top: 1px solid var(--border-color); margin-top: 20px; padding-top: 15px; max-height: 200px; overflow-y: auto; }
        .comment-node { padding: 10px 0; border-bottom: 1px solid var(--hover-bg); font-size: 0.9rem; }
        .comment-node:last-child { border-bottom: none; }
        .comment-bar { display: flex; gap: 10px; margin-top: 15px; align-items: center; position: relative; }
        
        #commentEmojiPicker {
            display: none; position: absolute; bottom: 50px; left: 0; background: var(--panel-bg); 
            border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; 
            width: 260px; flex-wrap: wrap; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 10;
        }

        .settings-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 25px; }
        .close-icon { position: absolute; right: 20px; top: 20px; cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="overlay">
        <div class="modal">
            <h2 style="margin-top:0; margin-bottom: 5px;">RequiresAL Secure Hub</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0; margin-bottom: 20px;">System access requires an authorized code.</p>
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Access Code</label>
            <input type="password" id="loginCode" placeholder="Enter Invite Code" class="input-ui" style="margin-top: 5px; margin-bottom: 20px;">
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Select Profile Avatar</label>
            <div class="avatar-grid" id="loginAvatars" style="margin-top: 5px;"></div>
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Display Name</label>
            <input type="text" id="loginName" placeholder="Username" class="input-ui" style="margin-top: 5px;">
            
            <button class="btn-main" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="processIdentity('login')">Enter RequiresAL</button>
        </div>
    </div>

    <div id="settingsOverlay" class="overlay">
        <div class="modal">
            <h2 style="margin-top:0;">My Settings</h2>
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Display Name</label>
            <input type="text" id="editName" class="input-ui">

            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Profile Avatar</label>
            <div class="avatar-grid" id="settingsAvatars"></div>

            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); margin-top: 10px; display: block;">Layout Format</label>
            <select id="editLayout" class="input-ui" style="margin-top: 5px;">
                <option value="grid-view">Grid Display</option>
                <option value="list-view">List Display</option>
            </select>

            <div class="settings-footer">
                <button class="btn-main btn-secondary" onclick="toggleSettings()">Cancel</button>
                <button class="btn-main" onclick="processIdentity('settings')">Save</button>
            </div>
        </div>
    </div>

    <div id="createPostOverlay" class="overlay">
        <div class="modal" style="max-width: 600px;">
            <span class="close-icon" onclick="toggleCreatePost()">✕</span>
            <h2 style="margin-top:0; margin-bottom: 20px;">Create Module</h2>

            <input type="text" id="postTitle" class="input-ui" placeholder="Module Title">
            <textarea id="postDesc" class="input-ui" style="height: 60px; resize: none;" placeholder="Description..."></textarea>
            <textarea id="postCode" class="input-ui" style="height: 100px; resize: none; font-family: monospace;" placeholder="Require code payload..."></textarea>
            
            <div class="creation-tag-wrapper" id="formTagContainer"></div>
            
            <div class="file-row">
                <div class="file-field">
                    <label>Thumbnail Image</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <div class="file-field">
                    <label>Module File</label>
                    <input type="file" id="fileInput">
                </div>
            </div>

            <button class="btn-main" style="width: 100%; padding: 12px;" onclick="publishComponent()">Publish Require</button>
        </div>
    </div>

    <div id="editPostOverlay" class="overlay">
        <div class="modal">
            <span class="close-icon" onclick="closeEditMenu()">✕</span>
            <h2 style="margin-top:0; margin-bottom: 20px;">Manage Require</h2>
            
            <input type="hidden" id="editPostId">
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Edit Title</label>
            <input type="text" id="editPostTitle" class="input-ui">
            
            <label style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted); display: block; margin-top: 10px;">Edit Payload Text</label>
            <textarea id="editPostCode" class="input-ui" style="height: 120px; resize: none; font-family: monospace;"></textarea>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-main btn-danger" onclick="deletePost()">Delete</button>
                <button class="btn-main" style="flex-grow: 1;" onclick="savePostEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="postOverlay" class="overlay">
        <div class="modal" style="max-width: 700px; max-height: 90vh; overflow-y: auto;">
            <span class="close-icon" onclick="closePost()">✕</span>
            <div id="modalContent"></div>
            
            <div class="comments-section">
                <h3 style="margin-top:0;">Comments</h3>
                <div id="commentContainer"></div>
                <div class="comment-bar">
                    <div id="commentEmojiPicker"></div>
                    <span id="commenterAvatar" style="font-size: 1.4rem; cursor: pointer; user-select: none;" title="Pick an emoji for this comment" onclick="toggleCommentEmojiPicker()">🦊</span>
                    
                    <input type="text" id="newCommentInput" class="input-ui" style="margin-bottom:0;" placeholder="Add a comment..." onkeypress="if(event.key==='Enter') deployComment()">
                    <button class="btn-main" onclick="deployComment()">Post</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>RequiresAL</h1>
        <p class="subtitle">Securely store, style, and query your component modules.</p>
        
        <div class="main-layout">
            <div class="sidebar">
                <div class="sidebar-panel">
                    <h3>Query Engine</h3>
                    <input type="text" class="input-ui" placeholder="Filter strings..." oninput="pushQuery('search', this.value)">
                    <select class="input-ui" style="margin-bottom: 0;" onchange="pushQuery('sort', this.value)">
                        <option value="new">Recently Created</option>
                        <option value="old">Oldest First</option>
                    </select>
                </div>

                <div class="sidebar-panel">
                    <h3>Streams</h3>
                    <button class="filter-btn active" id="s-all" onclick="pushQuery('scope', 'all')"><span>🏠</span> Home</button>
                    <button class="filter-btn" id="s-fav" onclick="pushQuery('scope', 'fav')"><span>⭐</span> Favorites</button>
                </div>

                <div class="sidebar-panel">
                    <h3>Categories</h3>
                    <div id="sidebarTags"></div>
                </div>

                <button class="btn-main btn-secondary" style="margin-top: auto;" onclick="toggleSettings()">⚙ Settings</button>
            </div>

            <div class="content-area">
                <div class="sidebar-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 25px;">
                    <span style="color: var(--text-light); font-weight: 600;">Ready to share your creation?</span>
                    <button class="btn-main" onclick="toggleCreatePost()">+ Put a require</button>
                </div>

                <div id="feed" class="grid-view"></div>
            </div>
        </div>
    </div>

    <script>
        // --- Persistence Elements ---
        let posts = JSON.parse(localStorage.getItem('al_posts')) || [];
        let user = JSON.parse(localStorage.getItem('al_user')) || null;
        let config = JSON.parse(localStorage.getItem('al_config')) || { layout: 'grid-view' };

        const tagRegistry = ["Morph", "Map", "Gear", "Fun", "Utilities", "GUI"];
        const customAvatars = ['😀','😎','🤖','👻','👽','🤠','👾','🦊','🐱','🐶','🐵','🦁','🐼','🐸','🐰','🐙','🦉','🦄','🐲','🐧','🐣','🐝'];
        
        let runtimeState = { search: '', sort: 'new', scope: 'all', activeTag: null, openId: null };
        let activeCommentEmoji = '🦊';

        // --- Core Startup ---
        window.onload = () => {
            document.getElementById('feed').className = config.layout;
            if (!user || !user.name) {
                document.getElementById('loginOverlay').classList.add('active');
                renderAvatarChoices('loginAvatars', '😀');
            } else {
                igniteHub();
            }
            
            // Build Comment Emoji Picker once
            document.getElementById('commentEmojiPicker').innerHTML = customAvatars.map(em => 
                `<span style="cursor:pointer; font-size:1.4rem;" onclick="selectCommentEmoji('${em}')">${em}</span>`
            ).join('');
        };

        function igniteHub() {
            renderFilterTagsUI();
            renderFeed();
            document.getElementById('editName').value = user.name;
            document.getElementById('editLayout').value = config.layout;
            activeCommentEmoji = user.avatar; 
        }

        // --- Identity & Configuration Handling ---
        function renderAvatarChoices(targetElementId, currentAvatar) {
            const container = document.getElementById(targetElementId);
            container.innerHTML = '';
            customAvatars.forEach((avatar) => {
                const item = document.createElement('div');
                item.className = `avatar-opt ${avatar === currentAvatar ? 'selected' : ''}`;
                item.textContent = avatar;
                item.onclick = () => {
                    container.querySelectorAll('.avatar-opt').forEach(node => node.classList.remove('selected'));
                    item.classList.add('selected');
                };
                container.appendChild(item);
            });
        }

        function processIdentity(workflowMode) {
            const inputField = workflowMode === 'login' ? 'loginName' : 'editName';
            const elementId = workflowMode === 'login' ? 'loginAvatars' : 'settingsAvatars';
            const calculatedName = document.getElementById(inputField).value.trim();
            const calculatedAvatar = document.querySelector(`#${elementId} .avatar-opt.selected`)?.textContent;

            if (workflowMode === 'login') {
                const accessCode = document.getElementById('loginCode').value.trim();
                if (accessCode !== "REQALC103657") {
                    return alert("Invalid Access Code. Access Denied.");
                }
            }

            if (!calculatedName) return alert("System requires a username.");

            user = { name: calculatedName, avatar: calculatedAvatar || '😀' };
            localStorage.setItem('al_user', JSON.stringify(user));

            if (workflowMode === 'settings') {
                config.layout = document.getElementById('editLayout').value;
                localStorage.setItem('al_config', JSON.stringify(config));
                document.getElementById('feed').className = config.layout;
                toggleSettings();
            }

            document.getElementById('loginOverlay').classList.remove('active');
            igniteHub();
        }

        function toggleSettings() {
            const target = document.getElementById('settingsOverlay');
            target.classList.toggle('active');
            if (target.classList.contains('active')) {
                renderAvatarChoices('settingsAvatars', user.avatar);
            }
        }

        function toggleCreatePost() {
            document.getElementById('createPostOverlay').classList.toggle('active');
        }

        // --- Post Edit & Deletion Controls ---
        function openEditMenu(e, id) {
            e.stopPropagation();
            const p = posts.find(x => x.id === id);
            document.getElementById('editPostId').value = id;
            document.getElementById('editPostTitle').value = p.title || '';
            document.getElementById('editPostCode').value = p.text || '';
            document.getElementById('editPostOverlay').classList.add('active');
        }

        function closeEditMenu() { document.getElementById('editPostOverlay').classList.remove('active'); }

        function savePostEdit() {
            const targetId = parseInt(document.getElementById('editPostId').value);
            const p = posts.find(x => x.id === targetId);
            
            p.title = document.getElementById('editPostTitle').value.trim();
            p.text = document.getElementById('editPostCode').value.trim();
            
            if(!p.text) return alert("Text payload cannot be empty.");
            
            localStorage.setItem('al_posts', JSON.stringify(posts));
            closeEditMenu();
            renderFeed();
        }

        function deletePost() {
            if(!confirm("Are you sure you want to permanently delete this require?")) return;
            const targetId = parseInt(document.getElementById('editPostId').value);
            posts = posts.filter(x => x.id !== targetId);
            localStorage.setItem('al_posts', JSON.stringify(posts));
            closeEditMenu();
            renderFeed();
        }

        // --- Reconstructed Filter System ---
        function pushQuery(actionType, actionValue) {
            runtimeState[actionType] = actionValue;
            if (actionType === 'scope') {
                document.getElementById('s-all').classList.toggle('active', actionValue === 'all');
                document.getElementById('s-fav').classList.toggle('active', actionValue === 'fav');
            }
            renderFeed();
        }

        function toggleTargetCategory(cat) {
            runtimeState.activeTag = (runtimeState.activeTag === cat) ? null : cat;
            document.querySelectorAll('[id^="tag-nav-"]').forEach(btn => btn.classList.remove('active'));
            if(runtimeState.activeTag) document.getElementById(`tag-nav-${cat}`).classList.add('active');
            renderFeed();
        }

        function renderFeed() {
            const viewMatrix = document.getElementById('feed');
            viewMatrix.innerHTML = '';

            let structuralSet = [...posts].filter(p => {
                const searchStr = runtimeState.search.toLowerCase();
                const textMatch = p.text.toLowerCase().includes(searchStr);
                const authorMatch = p.author.toLowerCase().includes(searchStr);
                const titleMatch = (p.title || '').toLowerCase().includes(searchStr);
                
                const evaluatesSearch = textMatch || authorMatch || titleMatch;
                const evaluatesScope = (runtimeState.scope === 'all' || p.starred);
                const evaluatesTags = (!runtimeState.activeTag || p.tags.includes(runtimeState.activeTag));
                return evaluatesSearch && evaluatesScope && evaluatesTags;
            });

            structuralSet.sort((prev, next) => runtimeState.sort === 'new' ? next.id - prev.id : prev.id - next.id);

            if(structuralSet.length === 0) {
                viewMatrix.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted); font-size: 1.1rem;">No results.</p>`;
                return;
            }

            structuralSet.forEach(item => {
                const moduleBlock = document.createElement('div');
                moduleBlock.className = 'require-post';
                moduleBlock.onclick = (event) => { 
                    if(event.target.tagName !== 'BUTTON') revealPostDetail(item.id); 
                };
                
                const displayTitle = item.title ? item.title : 'Untitled Module';
                const imageDOM = item.img 
                    ? `<img src="${item.img}" class="post-banner-img">` 
                    : `<div class="no-image-fallback">No Image</div>`;

                // Three dots are only rendered if the user is the author
                const manageButtonDOM = (item.author === user.name) 
                    ? `<button class="menu-btn" onclick="openEditMenu(event, ${item.id})">⋮</button>` 
                    : '';

                moduleBlock.innerHTML = `
                    ${imageDOM}
                    <div class="post-content-wrapper">
                        <div class="post-header-top">
                            <h3 class="post-title-text">${displayTitle}</h3>
                            <div class="post-actions">
                                ${manageButtonDOM}
                                <button class="star-btn ${item.starred ? 'active' : ''}" onclick="mutateStarStatus(event, ${item.id})">★</button>
                            </div>
                        </div>
                        <div class="post-author-text">By @${item.author}</div>
                        <div class="require-text">${item.text}</div>
                    </div>
                `;
                viewMatrix.appendChild(moduleBlock);
            });
        }

        // --- Storage Deploy Logic ---
        async function publishComponent() {
            const avatarSelection = user.avatar;
            const postTitle = document.getElementById('postTitle').value.trim();
            const postDesc = document.getElementById('postDesc').value.trim();
            const rawText = document.getElementById('postCode').value.trim();
            
            if(!rawText) return alert("System requires code input to deploy.");

            const selectedCategories = tagRegistry.filter(tag => document.getElementById(`form-check-${tag}`).checked);
            const imageFile = document.getElementById('imageInput').files[0];
            const externalFile = document.getElementById('fileInput').files[0];

            const conceptualPayload = {
                id: Date.now(),
                author: user.name,
                avatar: avatarSelection,
                title: postTitle,
                desc: postDesc,
                text: rawText,
                tags: selectedCategories,
                starred: false,
                comments: [],
                img: imageFile ? await transformBinaryToBase64(imageFile) : null,
                file: externalFile ? await transformBinaryToBase64(externalFile) : null,
                fileName: externalFile ? externalFile.name : null
            };

            posts.unshift(conceptualPayload);
            localStorage.setItem('al_posts', JSON.stringify(posts));

            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            document.getElementById('postCode').value = '';
            document.getElementById('imageInput').value = '';
            document.getElementById('fileInput').value = '';
            tagRegistry.forEach(t => document.getElementById(`form-check-${t}`).checked = false);

            toggleCreatePost();
            renderFeed();
        }

        const transformBinaryToBase64 = targetFile => new Promise(res => {
            const processingInstance = new FileReader();
            processingInstance.readAsDataURL(targetFile);
            processingInstance.onload = () => res(processingInstance.result);
        });

        // --- Structural Functions ---
        function mutateStarStatus(e, targetId) {
            e.stopPropagation();
            const pointer = posts.find(p => p.id === targetId);
            pointer.starred = !pointer.starred;
            localStorage.setItem('al_posts', JSON.stringify(posts));
            renderFeed();
        }

        function performClipboardCopy(targetId) {
            navigator.clipboard.writeText(posts.find(p => p.id === targetId).text);
            alert("Source copied to clipboard!");
        }

        function fireDownload(targetId) {
            const targetNode = posts.find(p => p.id === targetId);
            const hiddenAnchor = document.createElement('a');
            hiddenAnchor.href = targetNode.file;
            hiddenAnchor.download = targetNode.fileName;
            hiddenAnchor.click();
        }

        function renderFilterTagsUI() {
            const leftNavigationContainer = document.getElementById('sidebarTags');
            const creationFormTagContainer = document.getElementById('formTagContainer');
            
            leftNavigationContainer.innerHTML = '';
            creationFormTagContainer.innerHTML = '';

            tagRegistry.forEach(tag => {
                leftNavigationContainer.innerHTML += `<button class="filter-btn" id="tag-nav-${tag}" onclick="toggleTargetCategory('${tag}')"><span>#</span> ${tag}</button>`;
                creationFormTagContainer.innerHTML += `
                    <input type="checkbox" id="form-check-${tag}" class="creation-tag-box">
                    <label for="form-check-${tag}" class="creation-tag-label">${tag}</label>
                `;
            });
        }

        // --- Restored Commenting & Detail Modules ---
        function revealPostDetail(targetId) {
            runtimeState.openId = targetId;
            const node = posts.find(p => p.id === targetId);
            
            activeCommentEmoji = user.avatar;
            document.getElementById('commenterAvatar').textContent = activeCommentEmoji;
            document.getElementById('commentEmojiPicker').style.display = 'none';
            
            const displayTitle = node.title ? `<h1 style="margin: 0 0 5px 0; font-size: 1.8rem; font-weight: 800;">${node.title}</h1>` : '';
            const displayDesc = node.desc ? `<p style="margin: 15px 0; color: var(--text-light); font-size: 1rem; line-height: 1.5;">${node.desc}</p>` : '';
            
            const displayImgDom = node.img 
                ? `<img src="${node.img}" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:8px; border: 1px solid var(--border-color);">`
                : `<div class="no-image-fallback" style="aspect-ratio:16/9; width:100%; height:auto;">No Image</div>`;

            document.getElementById('modalContent').innerHTML = `
                <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 300px;">
                        ${displayImgDom}
                    </div>
                    
                    <div style="flex: 1; min-width: 250px; display: flex; flex-direction: column;">
                        ${displayTitle}
                        <div style="font-size: 1rem; color:var(--text-muted); margin-bottom: 20px;">
                            ${node.avatar} By <span style="color: var(--text-light); font-weight: 600;">@${node.author}</span>
                        </div>
                        
                        <button class="btn-main" style="width: 100%; padding: 16px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 10px;" onclick="performClipboardCopy(${node.id})">
                            <span style="font-size: 1.4rem;">▶</span> Copy Source
                        </button>

                        ${node.file ? `<button class="btn-main btn-secondary" style="width: 100%; padding: 12px;" onclick="fireDownload(${node.id})">💾 Download Asset</button>` : ''}
                    </div>
                </div>

                <div style="margin-top: 30px;">
                    <div style="border-bottom: 1px solid var(--border-color); margin-bottom: 15px;">
                        <span style="display: inline-block; padding-bottom: 8px; border-bottom: 2px solid white; font-weight: bold; font-size: 1.1rem;">About</span>
                    </div>
                    ${displayDesc}
                    <div class="require-text" style="max-height:250px; overflow-y:auto; white-space:pre-wrap; font-size:0.95rem; background: var(--bg-color); border: 1px solid var(--border-color);">${node.text}</div>
                </div>
            `;
            generateCommentBlocks();
            document.getElementById('postOverlay').classList.add('active');
        }

        function closePost() { document.getElementById('postOverlay').classList.remove('active'); }

        function toggleCommentEmojiPicker() {
            const picker = document.getElementById('commentEmojiPicker');
            picker.style.display = (picker.style.display === 'flex') ? 'none' : 'flex';
        }

        function selectCommentEmoji(em) {
            activeCommentEmoji = em;
            document.getElementById('commenterAvatar').textContent = em;
            document.getElementById('commentEmojiPicker').style.display = 'none';
        }

        function generateCommentBlocks() {
            const targetNode = posts.find(p => p.id === runtimeState.openId);
            const containerBox = document.getElementById('commentContainer');
            
            if(!targetNode.comments || targetNode.comments.length === 0) {
                containerBox.innerHTML = `<div style="color:var(--text-muted); padding:10px 0;">Be the first to comment!</div>`;
                return;
            }
            
            containerBox.innerHTML = targetNode.comments.map(c => `
                <div class="comment-node">
                    <strong style="color:var(--text-light)">${c.avatar} ${c.author}</strong>
                    <div style="margin-top: 5px; color: var(--text-muted);">${c.text}</div>
                </div>
            `).join('');
            containerBox.scrollTop = containerBox.scrollHeight;
        }

        function deployComment() {
            const executionField = document.getElementById('newCommentInput');
            if(!executionField.value.trim()) return;

            const referenceNode = posts.find(p => p.id === runtimeState.openId);
            if(!referenceNode.comments) referenceNode.comments = [];

            referenceNode.comments.push({
                author: user.name,
                avatar: activeCommentEmoji, 
                text: executionField.value.trim()
            });

            executionField.value = '';
            localStorage.setItem('al_posts', JSON.stringify(posts));
            generateCommentBlocks();
        }
    </script>
</body>
</html>
