<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RequiresAL</title>
    <style>
        :root {
            --bg-color: #050706;
            --panel-bg: #0d110f;
            --border-color: #1a2e20;
            --primary-color: #00e676; 
            --primary-glow: rgba(0, 230, 118, 0.4);
            --text-light: #f0fdf4;
            --text-muted: #8caba3;
            --star-color: #ffca28;
            --font-family: 'Inter', sans-serif;
        }

        * { transition: border-color 0.3s, box-shadow 0.3s, color 0.3s; }

        body { 
            font-family: var(--font-family); 
            background-color: var(--bg-color); 
            color: var(--text-light);
            margin: 0; padding: 20px; 
            display: flex; justify-content: center; min-height: 100vh;
        }

        .ambient-glow {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, var(--primary-glow) 0%, transparent 70%);
            z-index: -1; pointer-events: none; opacity: 0.25;
        }

        .container { width: 100%; max-width: 1200px; z-index: 1; }
        h1 { font-size: 2.2rem; margin: 0 0 5px 0; color: white; text-shadow: 0 0 20px var(--primary-glow); }
        p.subtitle { color: var(--text-muted); margin: 0 0 30px 0; font-size: 1rem; }

        .main-layout { display: flex; gap: 30px; }
        
        /* Sidebar */
        .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; gap: 20px; }
        .sidebar-panel { 
            background: var(--panel-bg); 
            border: 1px solid var(--primary-color); 
            padding: 20px; border-radius: 16px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.5), inset 0 0 10px var(--primary-glow);
        }
        .sidebar-panel h3 { margin-top: 0; margin-bottom: 12px; font-size: 0.8rem; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px var(--primary-glow); }

        /* UI Inputs */
        .input-ui { 
            width: 100%; padding: 12px; background: #000; 
            border: 1px solid var(--border-color); border-radius: 8px; 
            color: white; font-family: inherit; margin-bottom: 10px; box-sizing: border-box; 
        }
        .input-ui:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 10px var(--primary-glow); }

        /* Navigation Buttons */
        .filter-btn { 
            background: transparent; border: 1px solid transparent; color: var(--text-muted); 
            text-align: left; padding: 10px; border-radius: 8px; cursor: pointer; width: 100%; font-family: inherit;
        }
        .filter-btn.active { color: var(--primary-color); background: rgba(255,255,255,0.03); border-color: var(--primary-color); box-shadow: 0 0 8px var(--primary-glow); }

        .btn-main { 
            background: var(--primary-color); color: #000; border: none; padding: 10px 20px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-family: inherit;
            box-shadow: 0 0 15px var(--primary-glow); transition: 0.2s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 0 25px var(--primary-color); }

        /* Form Creator Elements */
        .creation-tag-wrapper { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
        .creation-tag-box { display: none; }
        .creation-tag-label { background: #000; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; color: var(--text-muted); cursor: pointer; }
        .creation-tag-box:checked + .creation-tag-label { border-color: var(--primary-color); color: var(--primary-color); background: rgba(0, 230, 118, 0.05); }

        .file-row { display: flex; gap: 15px; margin-bottom: 15px; background: #000; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); }
        .file-field { display: flex; flex-direction: column; gap: 5px; flex: 1; font-size: 0.75rem; color: var(--text-muted); }
        .file-field input { color: white; font-size: 0.8rem; }

        /* Feed Layouts */
        .content-area { flex-grow: 1; display: flex; flex-direction: column; gap: 25px; }
        #feed.grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        #feed.list-view { display: flex; flex-direction: column; gap: 15px; }

        /* Post Cards */
        .require-post { 
            background: var(--panel-bg); border: 1px solid var(--border-color); 
            border-radius: 16px; padding: 20px; display: flex; flex-direction: column; 
            cursor: pointer; position: relative;
        }
        .require-post:hover { border-color: var(--primary-color); box-shadow: 0 0 20px var(--primary-glow); }
        .grid-view .require-post { min-height: 250px; }

        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; color: var(--primary-color); font-weight: bold; }
        .post-title-text { font-size: 1.2rem; color: white; margin: 0 0 5px 0; font-weight: bold; }
        .post-desc-text { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 10px 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        .star-btn { background: none; border: none; color: #333; font-size: 1.4rem; cursor: pointer; }
        .star-btn.active { color: var(--star-color); text-shadow: 0 0 10px var(--star-color); }

        .post-banner-img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; border: 1px solid var(--border-color); }
        .list-view .post-banner-img { width: 80px; height: 80px; margin-bottom: 0; margin-right: 15px; float: left; }

        .require-text { 
            flex-grow: 1; background: #000; padding: 12px; border-radius: 10px; 
            border: 1px solid var(--border-color); font-size: 0.85rem; font-family: 'JetBrains Mono', monospace;
            color: var(--primary-color); overflow: hidden; text-overflow: ellipsis;
        }
        .list-view .require-text { white-space: nowrap; height: 40px; }

        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn-card { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--primary-color); background: transparent; color: var(--primary-color); cursor: pointer; font-weight: bold; font-size: 0.75rem; }
        .btn-card:hover { background: var(--primary-color); color: #000; }

        /* Modals */
        .overlay { 
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 100; 
            display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: 0.3s; 
        }
        .overlay.active { opacity: 1; pointer-events: all; }
        
        .modal { 
            background: var(--panel-bg); border: 2px solid var(--primary-color); 
            padding: 30px; border-radius: 24px; width: 90%; max-width: 500px; 
            box-shadow: 0 0 40px var(--primary-glow); position: relative;
        }

        /* Avatar System */
        .avatar-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin: 15px 0; }
        .avatar-opt { 
            font-size: 1.5rem; cursor: pointer; padding: 12px; 
            background: #000; border: 2px solid var(--border-color); 
            border-radius: 12px; text-align: center;
        }
        .avatar-opt:hover { border-color: var(--primary-color); transform: scale(1.05); }
        .avatar-opt.selected { border-color: var(--primary-color); box-shadow: 0 0 15px var(--primary-glow); background: rgba(255,255,255,0.05); }

        /* Comments Engine UI */
        .comments-section { border-top: 1px solid var(--border-color); margin-top: 15px; padding-top: 15px; max-height: 180px; overflow-y: auto; }
        .comment-node { background: #000; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 8px; font-size: 0.85rem; }
        .comment-bar { display: flex; gap: 10px; margin-top: 15px; background: #000; padding: 8px 15px; border-radius: 20px; border: 1px solid var(--border-color); align-items: center; }
        .comment-bar input { background: transparent; border: none; color: white; flex-grow: 1; outline: none; font-family: inherit; }

        .settings-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color); }
        .close-icon { position: absolute; right: 20px; top: 15px; cursor: pointer; color: var(--text-muted); font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- System Setup -->
    <div id="loginOverlay" class="overlay">
        <div class="modal">
            <h2 style="text-align:center; color: var(--primary-color); text-shadow: 0 0 10px var(--primary-glow); margin-top:0;">Establish Session</h2>
            <div class="avatar-grid" id="loginAvatars"></div>
            <input type="text" id="loginName" placeholder="Create Username..." class="input-ui">
            <button class="btn-main" style="width: 100%" onclick="processIdentity('login')">Initialize Hub</button>
        </div>
    </div>

    <!-- Integrated Configuration Console (Settings) -->
    <div id="settingsOverlay" class="overlay">
        <div class="modal">
            <h2 style="color: var(--primary-color); margin-top:0; text-shadow: 0 0 10px var(--primary-glow);">Hub Configuration</h2>
            
            <label style="font-size: 0.8rem; color: var(--text-muted);">Change Identity Username</label>
            <input type="text" id="editName" class="input-ui">

            <label style="font-size: 0.8rem; color: var(--text-muted);">Modify Profile Icon</label>
            <div class="avatar-grid" id="settingsAvatars"></div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0;">
                <span style="font-size: 0.9rem;">Global Accent Spectrum</span>
                <input type="color" id="editColor" style="border:none; background:none; cursor:pointer; width:40px; height:30px;">
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin: 15px 0;">
                <span style="font-size: 0.9rem;">Layout Format</span>
                <select id="editLayout" class="input-ui" style="width: auto; margin-bottom:0; padding: 5px 10px;">
                    <option value="grid-view">Grid Structural Array</option>
                    <option value="list-view">List Sequential Array</option>
                </select>
            </div>

            <div class="settings-footer">
                <button class="filter-btn" style="width: auto;" onclick="toggleSettings()">Dismiss</button>
                <button class="btn-main" onclick="processIdentity('settings')">Save Adaptations</button>
            </div>
        </div>
    </div>

    <!-- Create Post Modal -->
    <div id="createPostOverlay" class="overlay">
        <div class="modal" style="max-width: 600px;">
            <span class="close-icon" onclick="toggleCreatePost()">✕</span>
            <h2 style="color: var(--primary-color); margin-top:0; text-shadow: 0 0 10px var(--primary-glow);">New Require</h2>
            
            <input type="text" id="postTitle" class="input-ui" placeholder="Title your module...">
            <textarea id="postDesc" class="input-ui" style="height: 60px; resize: none;" placeholder="Provide a brief description..."></textarea>
            <textarea id="postCode" class="input-ui" style="height: 120px; resize: none; font-family: monospace;" placeholder="Input your require code..."></textarea>
            
            <div class="creation-tag-wrapper" id="formTagContainer"></div>
            
            <div class="file-row">
                <div class="file-field">
                    <label>Cover Graphic Image</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                <div class="file-field">
                    <label>Attached Document Component</label>
                    <input type="file" id="fileInput">
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; margin-top: 15px;">
                <button class="btn-main" onclick="publishComponent()">Deploy Component</button>
            </div>
        </div>
    </div>

    <!-- Complete Detail & Commenting Modal -->
    <div id="postOverlay" class="overlay">
        <div class="modal" style="max-width: 650px;">
            <span class="close-icon" onclick="closePost()">✕</span>
            <div id="modalContent"></div>
            <div class="comments-section" id="commentContainer"></div>
            <div class="comment-bar">
                <span id="commenterAvatar">🦊</span>
                <input type="text" id="newCommentInput" placeholder="Make a comment..." onkeypress="if(event.key==='Enter') deployComment()">
                <button style="background:none; border:none; color:var(--primary-color); cursor:pointer; font-weight:bold;" onclick="deployComment()">Post</button>
            </div>
        </div>
    </div>

    <!-- Main Application Interface -->
    <div class="container">
        <h1>RequiresAL</h1>
        <p class="subtitle">Securely store, style, and query your component modules.</p>
        
        <div class="main-layout">
            
            <div class="sidebar">
                <div class="sidebar-panel">
                    <h3>Query Engine</h3>
                    <input type="text" class="input-ui" placeholder="Filter strings..." oninput="pushQuery('search', this.value)">
                    <select class="input-ui" onchange="pushQuery('sort', this.value)">
                        <option value="new">Newest → Oldest</option>
                        <option value="old">Oldest → Newest</option>
                    </select>
                </div>

                <div class="sidebar-panel">
                    <h3>Streams</h3>
                    <button class="filter-btn active" id="s-all" onclick="pushQuery('scope', 'all')">Global Matrix</button>
                    <button class="filter-btn" id="s-fav" onclick="pushQuery('scope', 'fav')">Favorites ★</button>
                </div>

                <div class="sidebar-panel">
                    <h3>Categories</h3>
                    <div id="sidebarTags"></div>
                </div>

                <button class="btn-main" style="margin-top: auto;" onclick="toggleSettings()">⚙ Access System Settings</button>
            </div>

            <div class="content-area">
                <!-- Post Creation Trigger Panel -->
                <div class="sidebar-panel" style="display: flex; justify-content: space-between; align-items: center; padding: 20px 25px;">
                    <span style="color: var(--text-muted); font-size: 0.95rem;">Have a new module to share?</span>
                    <button class="btn-main" onclick="toggleCreatePost()">+ Put a require</button>
                </div>

                <div id="feed" class="grid-view"></div>
            </div>

        </div>
    </div>

    <script>
        // --- Persistence Elements ---
        let posts = JSON.parse(localStorage.getItem('al_posts')) || [];
        let user = JSON.parse(localStorage.getItem('al_user')) || null;
        let config = JSON.parse(localStorage.getItem('al_config')) || { color: '#00e676', layout: 'grid-view' };

        const tagRegistry = ["Morph", "Map", "Gear", "Fun", "Utilities", "GUI"];
        const customAvatars = ['🦊','🐼','🐸','🐯','🐰','🐙','🦉','🦄','🐲','🐱','🐶','🐹','🐨','🦁','🐵','🐧','🐣','🐝','🦋','🤖','👽','👾'];
        
        let runtimeState = { search: '', sort: 'new', scope: 'all', activeTag: null, openId: null };

        // --- Core Startup ---
        window.onload = () => {
            applySystemTheme();
            if (!user || !user.name) {
                document.getElementById('loginOverlay').classList.add('active');
                renderAvatarChoices('loginAvatars');
            } else {
                igniteHub();
            }
        };

        function igniteHub() {
            renderFilterTagsUI();
            renderFeed();
            document.getElementById('editName').value = user.name;
            document.getElementById('editColor').value = config.color;
            document.getElementById('editLayout').value = config.layout;
        }

        function applySystemTheme() {
            const r = document.documentElement;
            r.style.setProperty('--primary-color', config.color);
            r.style.setProperty('--primary-glow', transformHexToRgba(config.color, 0.35));
            document.getElementById('feed').className = config.layout;
        }

        function transformHexToRgba(hex, alpha) {
            let parsed = hex.substring(1).split('');
            if(parsed.length === 3) parsed = [parsed[0], parsed[0], parsed[1], parsed[1], parsed[2], parsed[2]];
            let rawNum = parseInt('0x' + parsed.join(''));
            return `rgba(${(rawNum>>16)&255}, ${(rawNum>>8)&255}, ${rawNum&255}, ${alpha})`;
        }

        // --- Identity & Configuration Handling ---
        function renderAvatarChoices(targetElementId) {
            const container = document.getElementById(targetElementId);
            container.innerHTML = '';
            customAvatars.forEach((avatar, index) => {
                const item = document.createElement('div');
                item.className = `avatar-opt ${index === 0 ? 'selected' : ''}`;
                item.textContent = avatar;
                item.onclick = () => {
                    container.querySelectorAll('.avatar-opt').forEach(node => node.classList.remove('selected'));
                    item.classList.add('selected');
                };
                container.appendChild(item);
            });
        }

        function processIdentity(workflowMode) {
            const inputField = workflowMode === 'login' ? 'loginName' : 'editName';
            const elementId = workflowMode === 'login' ? 'loginAvatars' : 'settingsAvatars';
            const calculatedName = document.getElementById(inputField).value.trim();
            const calculatedAvatar = document.querySelector(`#${elementId} .avatar-opt.selected`)?.textContent;

            if (!calculatedName) return alert("System requires valid verification credentials.");

            user = { name: calculatedName, avatar: calculatedAvatar || '🦊' };
            localStorage.setItem('al_user', JSON.stringify(user));

            if (workflowMode === 'settings') {
                config.color = document.getElementById('editColor').value;
                config.layout = document.getElementById('editLayout').value;
                localStorage.setItem('al_config', JSON.stringify(config));
                applySystemTheme();
                toggleSettings();
            }

            document.getElementById('loginOverlay').classList.remove('active');
            igniteHub();
        }

        function toggleSettings() {
            const target = document.getElementById('settingsOverlay');
            target.classList.toggle('active');
            if (target.classList.contains('active')) {
                renderAvatarChoices('settingsAvatars');
                document.querySelectorAll('#settingsAvatars .avatar-opt').forEach(node => {
                    if(node.textContent === user.avatar) node.classList.add('selected');
                    else node.classList.remove('selected');
                });
            }
        }

        function toggleCreatePost() {
            const target = document.getElementById('createPostOverlay');
            target.classList.toggle('active');
        }

        // --- Reconstructed Filter System ---
        function pushQuery(actionType, actionValue) {
            runtimeState[actionType] = actionValue;
            if (actionType === 'scope') {
                document.getElementById('s-all').classList.toggle('active', actionValue === 'all');
                document.getElementById('s-fav').classList.toggle('active', actionValue === 'fav');
            }
            renderFeed();
        }

        function toggleTargetCategory(cat) {
            runtimeState.activeTag = (runtimeState.activeTag === cat) ? null : cat;
            document.querySelectorAll('[id^="tag-nav-"]').forEach(btn => btn.classList.remove('active'));
            if(runtimeState.activeTag) document.getElementById(`tag-nav-${cat}`).classList.add('active');
            renderFeed();
        }

        function renderFeed() {
            const viewMatrix = document.getElementById('feed');
            viewMatrix.innerHTML = '';

            let structuralSet = [...posts].filter(p => {
                const searchStr = runtimeState.search.toLowerCase();
                const textMatch = p.text.toLowerCase().includes(searchStr);
                const authorMatch = p.author.toLowerCase().includes(searchStr);
                const titleMatch = (p.title || '').toLowerCase().includes(searchStr);
                
                const evaluatesSearch = textMatch || authorMatch || titleMatch;
                const evaluatesScope = (runtimeState.scope === 'all' || p.starred);
                const evaluatesTags = (!runtimeState.activeTag || p.tags.includes(runtimeState.activeTag));
                return evaluatesSearch && evaluatesScope && evaluatesTags;
            });

            structuralSet.sort((prev, next) => runtimeState.sort === 'new' ? next.id - prev.id : prev.id - next.id);

            if(structuralSet.length === 0) {
                viewMatrix.innerHTML = `<p style="grid-column: 1/-1; text-align:center; padding:40px; color:var(--text-muted); font-size: 1.1rem;">No results.</p>`;
                return;
            }

            structuralSet.forEach(item => {
                const moduleBlock = document.createElement('div');
                moduleBlock.className = 'require-post';
                moduleBlock.onclick = (event) => { if(event.target.tagName !== 'BUTTON') revealPostDetail(item.id); };
                
                const displayTitle = item.title ? item.title : 'Untitled Component';
                const displayDesc = item.desc ? `<p class="post-desc-text">${item.desc}</p>` : '';

                moduleBlock.innerHTML = `
                    <div class="post-header">
                        <span style="font-weight: normal; font-size: 0.9rem;">${item.avatar} ${item.author}</span>
                        <button class="star-btn ${item.starred ? 'active' : ''}" onclick="mutateStarStatus(event, ${item.id})">★</button>
                    </div>
                    <h3 class="post-title-text">${displayTitle}</h3>
                    ${displayDesc}
                    ${item.img ? `<img src="${item.img}" class="post-banner-img">` : ''}
                    <div class="require-text">${item.text.substring(0, 80)}${item.text.length > 80 ? '...' : ''}</div>
                    <div class="card-actions">
                        <button class="btn-card" onclick="performClipboardCopy(event, ${item.id})">Copy Source</button>
                        ${item.file ? `<button class="btn-card" onclick="fireDownload(event, ${item.id})">Fetch Asset</button>` : ''}
                    </div>
                `;
                viewMatrix.appendChild(moduleBlock);
            });
        }

        // --- Storage Deploy Logic ---
        async function publishComponent() {
            const postTitle = document.getElementById('postTitle').value.trim();
            const postDesc = document.getElementById('postDesc').value.trim();
            const rawText = document.getElementById('postCode').value.trim();
            
            if(!rawText) return alert("System requires code input to deploy.");

            const selectedCategories = tagRegistry.filter(tag => document.getElementById(`form-check-${tag}`).checked);
            const imageFile = document.getElementById('imageInput').files[0];
            const externalFile = document.getElementById('fileInput').files[0];

            const conceptualPayload = {
                id: Date.now(),
                author: user.name,
                avatar: user.avatar,
                title: postTitle,
                desc: postDesc,
                text: rawText,
                tags: selectedCategories,
                starred: false,
                comments: [],
                img: imageFile ? await transformBinaryToBase64(imageFile) : null,
                file: externalFile ? await transformBinaryToBase64(externalFile) : null,
                fileName: externalFile ? externalFile.name : null
            };

            posts.unshift(conceptualPayload);
            localStorage.setItem('al_posts', JSON.stringify(posts));

            // Clean Form States
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            document.getElementById('postCode').value = '';
            document.getElementById('imageInput').value = '';
            document.getElementById('fileInput').value = '';
            tagRegistry.forEach(t => document.getElementById(`form-check-${t}`).checked = false);

            toggleCreatePost();
            renderFeed();
        }

        const transformBinaryToBase64 = targetFile => new Promise(res => {
            const processingInstance = new FileReader();
            processingInstance.readAsDataURL(targetFile);
            processingInstance.onload = () => res(processingInstance.result);
        });

        // --- Structural Functions ---
        function mutateStarStatus(e, targetId) {
            e.stopPropagation();
            const pointer = posts.find(p => p.id === targetId);
            pointer.starred = !pointer.starred;
            localStorage.setItem('al_posts', JSON.stringify(posts));
            renderFeed();
        }

        function performClipboardCopy(e, targetId) {
            e.stopPropagation();
            navigator.clipboard.writeText(posts.find(p => p.id === targetId).text);
        }

        function fireDownload(e, targetId) {
            e.stopPropagation();
            const targetNode = posts.find(p => p.id === targetId);
            const hiddenAnchor = document.createElement('a');
            hiddenAnchor.href = targetNode.file;
            hiddenAnchor.download = targetNode.fileName;
            hiddenAnchor.click();
        }

        function renderFilterTagsUI() {
            const leftNavigationContainer = document.getElementById('sidebarTags');
            const creationFormTagContainer = document.getElementById('formTagContainer');
            
            leftNavigationContainer.innerHTML = '';
            creationFormTagContainer.innerHTML = '';

            tagRegistry.forEach(tag => {
                leftNavigationContainer.innerHTML += `<button class="filter-btn" id="tag-nav-${tag}" onclick="toggleTargetCategory('${tag}')"># ${tag}</button>`;
                creationFormTagContainer.innerHTML += `
                    <input type="checkbox" id="form-check-${tag}" class="creation-tag-box">
                    <label for="form-check-${tag}" class="creation-tag-label">${tag}</label>
                `;
            });
        }

        // --- Restored Commenting Modules ---
        function revealPostDetail(targetId) {
            runtimeState.openId = targetId;
            const node = posts.find(p => p.id === targetId);
            document.getElementById('commenterAvatar').textContent = user.avatar;
            
            const displayTitle = node.title ? `<h2 style="margin: 10px 0 5px 0; color: white;">${node.title}</h2>` : '';
            const displayDesc = node.desc ? `<p style="margin: 0 0 15px 0; color: var(--text-muted); font-size: 0.95rem;">${node.desc}</p>` : '';

            document.getElementById('modalContent').innerHTML = `
                <div class="post-header" style="margin-bottom:0;"><span style="font-size: 0.9rem; color:var(--text-muted);">${node.avatar} ${node.author}</span></div>
                ${displayTitle}
                ${displayDesc}
                ${node.img ? `<img src="${node.img}" style="width:100%; max-height:200px; object-fit:contain; margin-bottom:15px; border-radius:8px; border: 1px solid var(--border-color);">` : ''}
                <div class="require-text" style="max-height:250px; overflow-y:auto; white-space:pre-wrap; font-size:0.95rem;">${node.text}</div>
            `;
            generateCommentBlocks();
            document.getElementById('postOverlay').classList.add('active');
        }

        function closePost() { document.getElementById('postOverlay').classList.remove('active'); }

        function generateCommentBlocks() {
            const targetNode = posts.find(p => p.id === runtimeState.openId);
            const containerBox = document.getElementById('commentContainer');
            
            if(!targetNode.comments || targetNode.comments.length === 0) {
                containerBox.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:10px;">Be the first to comment!</div>`;
                return;
            }
            
            containerBox.innerHTML = targetNode.comments.map(c => `
                <div class="comment-node">
                    <strong style="color:var(--primary-color)">${c.avatar} ${c.author}:</strong> <span style="color: #e2e8f0;">${c.text}</span>
                </div>
            `).join('');
            containerBox.scrollTop = containerBox.scrollHeight;
        }

        function deployComment() {
            const executionField = document.getElementById('newCommentInput');
            if(!executionField.value.trim()) return;

            const referenceNode = posts.find(p => p.id === runtimeState.openId);
            if(!referenceNode.comments) referenceNode.comments = [];

            referenceNode.comments.push({
                author: user.name,
                avatar: user.avatar,
                text: executionField.value.trim()
            });

            executionField.value = '';
            localStorage.setItem('al_posts', JSON.stringify(posts));
            generateCommentBlocks();
        }
    </script>
</body>
</html>
